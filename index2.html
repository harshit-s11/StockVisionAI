<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Prediction Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary-color: #7c3aed;
            --primary-hover: #8b5cf6;
            --secondary-color: #a855f7;
            --accent-color: #c084fc;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            --text-light: #f8fafc;
            --text-dark: #1f2937;
            --text-muted: #9ca3af;
            --bg-black: #000000;
            --bg-dark: #0f0f0f;
            --bg-darker: #1a1a1a;
            --glass-bg: rgba(0, 0, 0, 0.7);
            --glass-border: rgba(124, 58, 237, 0.3);
            --purple-glow: rgba(124, 58, 237, 0.5);
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            --purple-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* General Styling */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: var(--text-light);
            background: radial-gradient(ellipse at top, #1a0f2e 0%, #0a0a0a 50%, #000000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            background: var(--purple-glow);
            border-radius: 50%;
            animation: float 20s infinite linear;
            box-shadow: 0 0 15px var(--purple-glow), 0 0 30px rgba(124, 58, 237, 0.3);
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        @keyframes purpleGlow {
            from {
                filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.5));
            }
            to {
                filter: drop-shadow(0 0 40px rgba(124, 58, 237, 0.8));
            }
        }

        .overlay {
            background: radial-gradient(ellipse at center, rgba(124, 58, 237, 0.15) 0%, rgba(0, 0, 0, 0.8) 70%, rgba(0, 0, 0, 0.95) 100%);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 4rem 3rem;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: var(--purple-shadow), inset 0 1px 0 rgba(124, 58, 237, 0.2), 0 0 50px rgba(124, 58, 237, 0.1);
            max-width: 650px;
            width: 90%;
            animation: slideInUp 1s ease-out;
            transition: all 0.4s ease;
        }
        
        .content:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px -12px rgba(124, 58, 237, 0.4), inset 0 1px 0 rgba(124, 58, 237, 0.3), 0 0 80px rgba(124, 58, 237, 0.2);
            border-color: var(--accent-color);
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(124, 58, 237, 0.5);
            letter-spacing: -0.025em;
            line-height: 1.1;
            animation: purpleGlow 3s ease-in-out infinite alternate;
        }
        


        p {
            font-size: 1.125rem;
            font-weight: 400;
            margin-bottom: 2.5rem;
            line-height: 1.8;
            color: var(--text-muted);
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        select, button {
            font-family: inherit;
            font-size: 1.1rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            max-width: 350px;
        }

        select {
            background: var(--bg-darker);
            color: var(--text-light);
            font-weight: 500;
            cursor: pointer;
            border: 2px solid var(--glass-border);
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.3), 0 0 20px rgba(124, 58, 237, 0.2);
            transform: scale(1.02);
        }
        
        select option {
            padding: 1rem;
            font-weight: 500;
        }

        button {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            cursor: pointer;
            border: none;
            font-weight: 600;
            box-shadow: var(--purple-shadow);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.875rem;
        }
        
        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(192, 132, 252, 0.4), transparent);
            transition: left 0.6s;
        }
        
        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--accent-color) 100%);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(124, 58, 237, 0.6), 0 0 30px rgba(124, 58, 237, 0.3);
        }
        
        button:active {
            transform: translateY(0) scale(0.98);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            margin-top: 1.5rem;
            color: white;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--primary-color);
            border-right: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: var(--error-color);
            font-weight: 600;
            margin-top: 1.5rem;
            display: none;
            padding: 1rem;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .auth-links {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeInRight 0.8s ease-out 0.3s both;
        }
        
        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .auth-links a {
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .auth-links a:hover {
            background: rgba(124, 58, 237, 0.3);
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(124, 58, 237, 0.4), 0 0 20px rgba(124, 58, 237, 0.2);
        }

        .user-info {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0.9;
        }
        
        /* Stock icons */
        .stock-option {
            position: relative;
            padding-left: 2.5rem;
        }
        
        .stock-option::before {
            content: '📈';
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .content {
                padding: 2rem;
                margin: 1rem;
            }
            
            h1 {
                font-size: 3rem;
            }
            
            p {
                font-size: 1.1rem;
            }
            
            .auth-links {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 2rem;
                justify-content: center;
            }
            
            select, button {
                font-size: 1rem;
                padding: 0.875rem 1.25rem;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .auth-links {
                flex-direction: column;
                gap: 0.5rem;
                align-items: stretch;
            }
            
            .auth-links a {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles" id="particles"></div>
    
    <div class="overlay"></div>
    
    <!-- Authentication Links -->
    <div class="auth-links" id="authLinks">
        <span id="userInfo" class="user-info" style="display: none;"></span>
        <a href="/portfolio" id="portfolioLink" style="display: none;">📊 Portfolio</a>
        <a href="/login" id="loginLink">🔐 Login</a>
        <a href="/register" id="registerLink">📝 Register</a>
        <a href="/logout" id="logoutLink" style="display: none;">🚪 Logout</a>
    </div>
    
    <div class="content">
        <h1>Welcome to StockVision</h1>
        <p>Harness the power of AI-driven analytics to make smarter investment decisions. Select a stock below to view comprehensive insights and predictions based on advanced machine learning models.</p>
        <form id="stockForm" class="form-container">
            <select id="stockDropdown" required>
                <option value="" disabled selected>🎯 Choose your stock to analyze</option>
                <option value="Nestle" class="stock-option">🥛 Nestle India Limited</option>
                <option value="MarutiSuzuki" class="stock-option">🚗 Maruti Suzuki India Limited</option>
                <option value="AxisBank" class="stock-option">🏦 Axis Bank Limited</option>
                <option value="TCS" class="stock-option">💻 Tata Consultancy Services</option>
                <option value="Infosys" class="stock-option">🌐 Infosys Limited</option>
                <option value="HDFC" class="stock-option">🏛️ HDFC Bank Limited</option>
                <option value="ICICI" class="stock-option">🏢 ICICI Bank Limited</option>
                <option value="SBI" class="stock-option">🏦 State Bank of India</option>
                <option value="Reliance" class="stock-option">⛽ Reliance Industries Limited</option>
                <option value="Wipro" class="stock-option">💼 Wipro Limited</option>
                <option value="HUL" class="stock-option">🧴 Hindustan Unilever Limited</option>
                <option value="ITC" class="stock-option">🚬 ITC Limited</option>
                <option value="Bajaj" class="stock-option">💳 Bajaj Finance Limited</option>
                <option value="Kotak" class="stock-option">🏛️ Kotak Mahindra Bank</option>
                <option value="LT" class="stock-option">🏗️ Larsen & Toubro Limited</option>
            </select>
            <button type="submit" id="submitBtn">
                <span id="btnText">🚀 Analyze & Predict</span>
            </button>
        </form>
        <div id="loading" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <span>Processing your request...</span>
        </div>
        <div id="error" class="error"></div>
    </div>

    <script>
        // Create animated particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 15 : 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 6 + 2;
                const left = Math.random() * 100;
                const animationDuration = Math.random() * 15 + 10;
                const delay = Math.random() * 20;
                
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDuration = `${animationDuration}s`;
                particle.style.animationDelay = `${delay}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // Enhanced loading animation
        function showLoading() {
            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            loading.style.display = 'flex';
            submitBtn.disabled = true;
            btnText.textContent = '🔄 Processing...';
            submitBtn.style.opacity = '0.7';
        }
        
        function hideLoading() {
            const loading = document.getElementById('loading');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            loading.style.display = 'none';
            submitBtn.disabled = false;
            btnText.textContent = '🚀 Analyze & Predict';
            submitBtn.style.opacity = '1';
        }
        
        // Enhanced error display
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = `⚠️ ${message}`;
            errorDiv.style.display = 'block';
            
            // Auto-hide error after 5 seconds
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Enhanced authentication UI with animations
        function updateAuthUI(authData) {
            const userInfo = document.getElementById('userInfo');
            const portfolioLink = document.getElementById('portfolioLink');
            const loginLink = document.getElementById('loginLink');
            const registerLink = document.getElementById('registerLink');
            const logoutLink = document.getElementById('logoutLink');
            
            if (authData.authenticated) {
                userInfo.textContent = `👋 Welcome, ${authData.username}!`;
                userInfo.style.display = 'inline';
                portfolioLink.style.display = 'inline';
                loginLink.style.display = 'none';
                registerLink.style.display = 'none';
                logoutLink.style.display = 'inline';
                
                // Ensure proper navigation
                portfolioLink.onclick = function(e) {
                    e.preventDefault();
                    window.location.href = '/portfolio';
                };
                
                logoutLink.onclick = function(e) {
                    e.preventDefault();
                    if (confirm('Are you sure you want to logout?')) {
                        window.location.href = '/logout';
                    }
                };
                
                // Add welcome animation
                userInfo.style.animation = 'fadeInRight 0.5s ease-out';
            } else {
                userInfo.style.display = 'none';
                portfolioLink.style.display = 'none';
                loginLink.style.display = 'inline';
                registerLink.style.display = 'inline';
                logoutLink.style.display = 'none';
            }
        }
        
        // Check authentication status with visual feedback
        function checkAuthStatus() {
            // Use injected auth data if available, otherwise fetch from server
            if (window.authData) {
                updateAuthUI(window.authData);
                return;
            }
            
            // Fallback to server request
            fetch('/auth_status', {
                credentials: 'include'
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    const userInfo = document.getElementById('userInfo');
                    const portfolioLink = document.getElementById('portfolioLink');
                    const loginLink = document.getElementById('loginLink');
                    const registerLink = document.getElementById('registerLink');
                    const logoutLink = document.getElementById('logoutLink');
                    
                    if (data.authenticated) {
                        userInfo.textContent = `👋 Welcome, ${data.username}!`;
                        userInfo.style.display = 'inline';
                        portfolioLink.style.display = 'inline';
                        loginLink.style.display = 'none';
                        registerLink.style.display = 'none';
                        logoutLink.style.display = 'inline';
                        
                        // Ensure proper navigation
                        portfolioLink.onclick = function(e) {
                            e.preventDefault();
                            window.location.href = '/portfolio';
                        };
                        
                        logoutLink.onclick = function(e) {
                            e.preventDefault();
                            if (confirm('Are you sure you want to logout?')) {
                                window.location.href = '/logout';
                            }
                        };
                        
                        // Add welcome animation
                        userInfo.style.animation = 'fadeInRight 0.5s ease-out';
                    } else {
                        userInfo.style.display = 'none';
                        portfolioLink.style.display = 'none';
                        loginLink.style.display = 'inline';
                        registerLink.style.display = 'inline';
                        logoutLink.style.display = 'none';
                    }
                })
                .catch(error => {

                    const userInfo = document.getElementById('userInfo');
                    const portfolioLink = document.getElementById('portfolioLink');
                    const loginLink = document.getElementById('loginLink');
                    const registerLink = document.getElementById('registerLink');
                    const logoutLink = document.getElementById('logoutLink');
                    
                    userInfo.style.display = 'none';
                    portfolioLink.style.display = 'none';
                    loginLink.style.display = 'inline';
                    registerLink.style.display = 'inline';
                    logoutLink.style.display = 'none';
                });
        }
        
        // Enhanced form validation with visual feedback
        function validateForm() {
            const stock = document.getElementById('stockDropdown').value;
            const dropdown = document.getElementById('stockDropdown');
            
            if (!stock) {
                dropdown.style.borderColor = 'var(--error-color)';
                dropdown.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
                showError('Please select a stock to analyze');
                
                // Reset border after 3 seconds
                setTimeout(() => {
                    dropdown.style.borderColor = '';
                    dropdown.style.boxShadow = '';
                }, 3000);
                
                return false;
            }
            
            return true;
        }
        
        // Add smooth transitions to dropdown
        function enhanceDropdown() {
            const dropdown = document.getElementById('stockDropdown');
            
            dropdown.addEventListener('focus', () => {
                dropdown.style.transform = 'scale(1.02)';
            });
            
            dropdown.addEventListener('blur', () => {
                dropdown.style.transform = 'scale(1)';
            });
            
            dropdown.addEventListener('change', () => {
                dropdown.style.borderColor = 'var(--success-color)';
                dropdown.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.1)';
                
                setTimeout(() => {
                    dropdown.style.borderColor = '';
                    dropdown.style.boxShadow = '';
                }, 1000);
            });
        }
        
        // Initialize everything when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing...'); // Debug log
            createParticles();
            checkAuthStatus();
            enhanceDropdown();
            
            // Check if form exists
            const form = document.getElementById('stockForm');
            console.log('Form found:', !!form); // Debug log
            
            // Check if dropdown exists
            const dropdown = document.getElementById('stockDropdown');
            console.log('Dropdown found:', !!dropdown); // Debug log
            
            // Check if button exists
            const button = document.getElementById('submitBtn');
            console.log('Button found:', !!button); // Debug log
            
            // Periodic authentication check (every 5 minutes)
            setInterval(checkAuthStatus, 5 * 60 * 1000);
            
            // Also check authentication when the page becomes visible again
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    checkAuthStatus();
                }
            });
            
            // Handle form submission with enhanced UX
            const formElement = document.getElementById('stockForm');
            if (formElement) {
                console.log('Adding event listener to form'); // Debug log
                formElement.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Form submitted!'); // Debug log
                    
                    if (!validateForm()) {
                        console.log('Form validation failed'); // Debug log
                        return;
                    }
                    
                    const stock = document.getElementById('stockDropdown').value;
                    console.log('Selected stock:', stock); // Debug log
                    showLoading();
                    
                    // Add a small delay for better UX
                    setTimeout(() => {
                        console.log('Redirecting to:', `/stock/${encodeURIComponent(stock)}`); // Debug log
                        window.location.href = `/stock/${encodeURIComponent(stock)}`;
                    }, 500);
                });
            } else {
                console.error('Form element not found!'); // Debug log
            }
            
            // Also add click handler to button as backup
            const buttonElement = document.getElementById('submitBtn');
            if (buttonElement) {
                console.log('Adding click handler to button'); // Debug log
                buttonElement.addEventListener('click', function(e) {
                    console.log('Button clicked!'); // Debug log
                    // Let the form submission handle it
                });
            } else {
                console.error('Button element not found!'); // Debug log
            }
        });
        
        // Handle window resize for particles
        window.addEventListener('resize', function() {
            const particlesContainer = document.getElementById('particles');
            particlesContainer.innerHTML = '';
            createParticles();
        });
        
        // Add mouse interaction effects
        document.addEventListener('mousemove', function(e) {
            const content = document.querySelector('.content');
            const rect = content.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (x >= 0 && x <= rect.width && y >= 0 && y <= rect.height) {
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = (y - centerY) / 20;
                const rotateY = (centerX - x) / 20;
                
                content.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-5px)`;
            } else {
                content.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
            }
        });
    </script>
</body>
</html>
