server:
  port: ${PORT:8080}

spring:
  application:
    name: stockvision-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stockvision}
    username: ${SPRING_DATASOURCE_USERNAME:stockvision_user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:300000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.6-flash}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
  embedding-dimension: ${GEMINI_EMBEDDING_DIMENSION:768}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:1200}
  rag-top-k: ${RAG_TOP_K:5}

market:
  simulation:
    enabled: ${MARKET_SIMULATION_ENABLED:true}
    interval-ms: ${MARKET_SIMULATION_INTERVAL_MS:15000}
    initial-delay-ms: ${MARKET_SIMULATION_INITIAL_DELAY_MS:10000}
    max-change-percent: ${MARKET_SIMULATION_MAX_CHANGE_PERCENT:1.50}
    min-price: ${MARKET_SIMULATION_MIN_PRICE:1.00}
