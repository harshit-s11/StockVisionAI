services:
  # 1. PostgreSQL 16 with pgvector extension preinstalled
  postgres:
    image: pgvector/pgvector:pg16
    container_name: stockvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockvision}
      POSTGRES_USER: ${POSTGRES_USER:-stockvision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - stockvision-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockvision_user} -d ${POSTGRES_DB:-stockvision}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. Spring Boot 3.3.x Backend (Java 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockvision-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stockvision}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stockvision_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_EMBEDDING_DIMENSION: ${GEMINI_EMBEDDING_DIMENSION:-768}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      MARKET_SIMULATION_ENABLED: ${MARKET_SIMULATION_ENABLED:-true}
      MARKET_SIMULATION_INTERVAL_MS: ${MARKET_SIMULATION_INTERVAL_MS:-15000}
      MARKET_SIMULATION_MAX_CHANGE_PERCENT: ${MARKET_SIMULATION_MAX_CHANGE_PERCENT:-1.50}
      MARKET_SIMULATION_MIN_PRICE: ${MARKET_SIMULATION_MIN_PRICE:-1.00}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockvision-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. React 18 SPA + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockvision-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - stockvision-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  stockvision-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local